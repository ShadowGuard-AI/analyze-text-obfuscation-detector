<polygon points="180,0 260,0 330,190 240,190" fill="#fff6c8" opacity="0.10"><animate attributeName="opacity" values="0.10;0.20;0.10" dur="8s" repeatCount="indefinite"/></polygon>
<polygon points="520,0 620,0 700,190 590,190" fill="#fff6c8" opacity="0.18"><animate attributeName="opacity" values="0.18;0.09;0.18" dur="11s" repeatCount="indefinite"/></polygon>
<polygon points="880,0 960,0 1030,190 940,190" fill="#fff6c8" opacity="0.12"><animate attributeName="opacity" values="0.12;0.21;0.12" dur="9s" repeatCount="indefinite"/></polygon>
<g fill="none" stroke="#e6f4f6" stroke-width="2.5"><circle cx="70" cy="240" r="6"><animate attributeName="cy" values="250;30" dur="14s" repeatCount="indefinite"/><animate attributeName="r" values="5;9" dur="14s" repeatCount="indefinite"/></circle><circle cx="86" cy="240" r="5"><animate attributeName="cy" values="260;40" dur="17s" begin="4s" repeatCount="indefinite"/><animate attributeName="r" values="4;8" dur="17s" begin="4s" repeatCount="indefinite"/></circle></g>
<rect x="0" y="196" width="1200" height="104" fill="#e6d3a3"/>
<line x1="120" y1="196" x2="1120" y2="182" stroke="#161c1c" stroke-width="4"/>
<g><rect x="430" y="128" width="86" height="70" fill="#14707c"/><rect x="418" y="192" width="110" height="10" fill="#c9b586"/><ellipse cx="473" cy="176" rx="86" ry="26" fill="none" stroke="#ee7fa0" stroke-width="4"><animate attributeName="rx" values="30;110" dur="6s" repeatCount="indefinite"/><animate attributeName="ry" values="9;33" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="6s" repeatCount="indefinite"/></ellipse></g>
<g opacity="0.75"><rect x="760" y="142" width="58" height="48" fill="#14707c"/><rect x="752" y="186" width="74" height="8" fill="#c9b586"/></g>
