<g><animateTransform attributeName="transform" type="rotate" values="-2 1080 210; 2 1080 210; -2 1080 210" dur="8s" repeatCount="indefinite"/><line x1="1030" y1="196" x2="1130" y2="222" stroke="#1e2424" stroke-width="2.5"/><circle cx="1052" cy="203" r="5" fill="#f6f0e2"/><circle cx="1080" cy="211" r="5" fill="#f6f0e2"/><circle cx="1108" cy="218" r="5" fill="#f6f0e2"/></g>
