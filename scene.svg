<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A cross section of the listening array in three depth bands: light shafts brightening and dimming and a column of bubbles rising in the far band, fixed hydrophone housings with listening rings spreading across their plates in the middle band, and shells, sand, and a swaying pearl strand in the near band">
